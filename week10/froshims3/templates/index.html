{% extends "layout.html" %}

{% block body %}
    <div class="container p-5">
        <h1>Register</h1>

        <form action="/register" method="post">
            
            <div class="mb-3">
                <input autocomplete="off" autofocus class="form-control" name="name" placeholder="Name" type="text">
            </div>

            <div class="mb-3">
                <p>Select a sport:</p>
                {% for sport in sports %}
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="sport" value="{{ sport }}" id="{{ sport }}">
                        <label class="form-check-label" for="{{ sport }}">
                            {{ sport }}
                        </label>
                    </div>
                {% endfor %}
            </div>

            <button class="btn btn-primary" type="submit">Register</button>

        </form>
    </div>
{% endblock %}
